[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "building-data"
version = "0.1.0"
description = "Portable building acquisition and map selection, with a Swiss provider"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.4.3", "pandas==3.0.1", "shapely==2.1.2", "scipy==1.17.1",
  "pyproj==3.7.2", "pyogrio==0.12.1", "geopandas==1.1.3", "gdal==3.13.0",
  "laspy[lazrs]==2.7.0", "pillow==12.1.1", "tifffile>=2026.3.3", "requests>=2.32",
  "fastapi==0.116.1", "uvicorn[standard]==0.35.0", "python-dotenv>=1.1", "filelock>=3.18",
]

[project.optional-dependencies]
imagery = ["torch==2.11.0", "torchvision==0.26.0", "mobile-sam", "timm==1.0.27", "opencv-python-headless==4.13.0.92"]

[tool.uv.sources]
mobile-sam = { git = "https://github.com/ChaoningZhang/MobileSAM.git", rev = "f706ad9c4eb7f219c00d9050e46328518ffb65d2" }
